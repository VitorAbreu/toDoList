@if(!getListItems().length) {
<div class="container">
  <img
    src="assets/img/task-list-null.png"
    alt="Your list is empty - illustrative image"
    loading="eager"
  />
  @if(addItem()) {
  <button class="btn btn-primary" (click)="addItem.set(false)">
    Create your To Do List
  </button>
  } @else {
  <app-input-add-item
    (outputAddListItems)="getInputAndAddItem($event)"
    [inputListItems]="getListItems()"
  />
  }
</div>
} @else {
<app-input-add-item
  (outputAddListItems)="getInputAndAddItem($event)"
  [inputListItems]="getListItems()"
/>

<main class="container">
  @if (listItemsStage('pending').length) {
    <h2>Pending issues</h2>
    <app-input-list-item [inputListItems]="listItemsStage('pending')"/>
  }

  @if (listItemsStage('completed')) {
    <h2>Finished</h2>
    <app-input-list-item [inputListItems]="listItemsStage('completed')"/>
  }
</main>

<footer><button class="btn btn-danger" (click)="deleteAllItems()">Delete All Items</button></footer>
}

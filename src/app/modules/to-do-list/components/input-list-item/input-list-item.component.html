@for (item of inputListItems(); track item) {
  <label [for]="item.id" class="input-label-text">
    <input type="checkbox" #inputCheckbox [checked]="item.checked">
    <input type="text" #inputValue [id]="item.id" [value]="item.value" placeholder="Add a Value" autofocus>
    <button class="btn btn-danger-circle" title="Delete this item"></button>
  </label>
}
